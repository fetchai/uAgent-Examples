[project]
name = "asi1-agent"
version = "0.1.0"
description = "This agent provides ASI:One chat and image generation."
authors = [
  { name = "Attila Bagoly", email = "attila.bagoly@fetch.ai" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "uagents>=0.26.1",
  "uagents-core>=0.4.12",
  "openai>=1.82.0",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
