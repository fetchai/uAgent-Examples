[project]
name = "openai-agent"
version = "0.1.0"
description = "This agent is a simple wrapper around OpenAI's `gpt-4o-mini` Large Language Model"
authors = [
  { name = "James Riehl", email = "james.riehl@fetch.ai" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "uagents>=0.22.4",
  "uagents-core>=0.3.1",
  "openai>=1.82.0",
  "requests>=2.32.3",
]

[tool.poetry]
packages = [{ include = "openai" }]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
