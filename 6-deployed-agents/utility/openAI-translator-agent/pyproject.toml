[project]
name = "openai-agent"
version = "0.1.0"
description = "This agent uses OpenAI's gpt-5.4-mini LLM to translate a given text from one language to another"
authors = [
  { name = "James Riehl", email = "james.riehl@fetch.ai" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "uagents>=0.25.4",
  "uagents-core>=0.4.9",
  "requests>=2.32.3",
]

[tool.poetry]
packages = [{ include = "openai" }]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
