[project]
name = "github-pr-agent"
version = "0.1.0"
description = "This agent returns a list of open pull requests in a github repository with in an organisation"
authors = [
  { name = "Kshipra Dhame", email = "kshipra.dhame@fetch.ai" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "uagents>=0.18.1",
  "requests>=2.32.3",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
